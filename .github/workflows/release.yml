name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  # 빌드 전 시험: 하나라도 실패하면 빌드·공개를 하지 않는다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: |
          pip install pyflakes playwright
          python -m playwright install --with-deps chromium
      - name: JS syntax
        run: for f in js/*.js tests/fake/*.js; do node --check "$f"; done
      - name: Python static check (undefined names etc.)
        run: python -m pyflakes pc/*.py tests/*.py
      - name: PC program starts
        run: python tests/pc_smoke.py
      - name: UI smoke (fake data, PC and phone sizes)
        run: python tests/ui_smoke.py
      - name: 재생 동기화 시험
        run: python tests/sync_test.py
      - name: PC ↔ 폰 https 연결 시험
        run: python tests/phonelink_test.py
      - name: Tape/box model values
        run: node --test tests/model_test.js

  # 폰 DB 규칙 시험 (Robolectric: 폰 없이 SQLite를 돌린다)
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - name: DB rules
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

  # 태그로 초안(draft) 릴리즈를 만든다. 다시 실행했을 때 이미 있으면 그대로 쓴다
  prepare:
    needs: [test, test-android]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Create draft release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes

  # 안드로이드 APK: Secrets의 키스토어로 서명해 초안에 첨부
  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21' # 키스토어를 만든 keytool과 같은 메이저 버전
      - name: Restore keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/release.keystore
      # 러너에 기본 설치된 Android SDK(ANDROID_HOME)를 그대로 쓴다
      - name: Build release APK
        working-directory: android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreleaseVersionName="$TAG" \
            -PreleaseKeystorePath="$PWD/keystore/release.keystore" \
            -PreleaseKeystorePassword="$KS_PASSWORD" \
            -PreleaseKeyAlias="$KEY_ALIAS" \
            -PreleaseKeyPassword="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "../tape-box_${TAG}.apk"
      - name: Upload to draft release
        run: gh release upload "$TAG" "tape-box_${TAG}.apk" --clobber

  # PC 프로그램: 백신 오탐을 줄이려고 부트로더를 직접 빌드하고, 폴더(onedir)로 묶어 zip으로 첨부
  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # pip 배포판의 공용 부트로더 대신 러너의 MSVC로 소스에서 컴파일한다
      # (sdist에도 미리 빌드된 부트로더가 들어 있어 waf로 직접 다시 빌드하고, 실제로 바뀌었는지 해시로 확인)
      - name: Install PyInstaller with self-built bootloader
        run: |
          mkdir -p _pyi && cd _pyi
          pip download --no-binary :all: --no-deps pyinstaller
          tar xzf pyinstaller-*.tar.gz && rm pyinstaller-*.tar.gz
          cd pyinstaller-*
          BL=PyInstaller/bootloader/Windows-64bit-intel/runw.exe
          before=$(sha256sum "$BL" | cut -d' ' -f1)
          (cd bootloader && python ./waf all --target-arch=64bit)
          after=$(sha256sum "$BL" | cut -d' ' -f1)
          echo "runw.exe: $before -> $after"
          [ "$before" != "$after" ] || { echo "부트로더가 다시 빌드되지 않았다"; exit 1; }
          pip install .
      - name: Install dependencies
        run: pip install -r pc/requirements.txt
      # exe 속성의 회사명·제품명·버전 정보 (태그 vX.Y.Z에서 숫자를 뽑는다)
      - name: Write version info
        run: |
          IFS=. read -r MA MI PA <<< "${TAG#v}"
          cat > version_info.txt <<EOF
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($MA, $MI, $PA, 0), prodvers=($MA, $MI, $PA, 0)),
            kids=[
              StringFileInfo([StringTable('041204B0', [
                StringStruct('CompanyName', 'huny4daniel'),
                StringStruct('FileDescription', 'tape-box'),
                StringStruct('FileVersion', '${TAG#v}'),
                StringStruct('InternalName', 'tape-box'),
                StringStruct('LegalCopyright', 'huny4daniel'),
                StringStruct('OriginalFilename', 'tape-box.exe'),
                StringStruct('ProductName', 'tape-box'),
                StringStruct('ProductVersion', '${TAG#v}')])]),
              VarFileInfo([VarStruct('Translation', [0x0412, 1200])])
            ]
          )
          EOF
      - name: Write app version (설정 화면에 보이는 PC 프로그램 버전)
        run: echo "VERSION = \"${TAG#v}\"" > pc/app_version.py
      - name: Build
        run: >
          pyinstaller --noconfirm --onedir --windowed --noupx
          --name tape-box --version-file version_info.txt --icon pc/assets/tape-box.ico
          --paths pc --add-data "pc/lyricsync_worker.py:." --add-data "pc/assets/tape-box.ico:assets" pc/tape_player.py
      - name: Zip
        working-directory: dist
        run: 7z a -tzip "../tape-box_${TAG}.zip" tape-box
      - name: Upload to draft release
        run: gh release upload "$TAG" "tape-box_${TAG}.zip" --clobber

  # 빌드가 성공한 뒤에만: 같은 major.minor의 이전 릴리즈를 지우고 초안을 공개한다
  publish:
    needs: [prepare, build-windows, build-android]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Delete previous releases of same major.minor
        run: |
          prefix="$(echo "$TAG" | cut -d. -f1-2)."
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -F "$prefix" | grep -vxF "$TAG" \
            | while read -r t; do gh release delete "$t" --yes; done || true
      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest
